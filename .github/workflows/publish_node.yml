name: 📦 Publish to Comfy registry
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Check the current version without publishing again
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: ♻️ Check out code
        uses: actions/checkout@v4
      - name: 📦 Publish Custom Node
        if: ${{ inputs.check_only != true }}
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registry review status
        run: python tools/check_registry_status.py --attempts 20 --interval 30 --summary "$GITHUB_STEP_SUMMARY"
