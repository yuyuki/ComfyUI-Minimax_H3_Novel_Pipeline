[project]
name = "minimax_h3_novel_pipeline"
description = "ComfyUI nodes for extracting novel references and generating MiniMax H3 prompts with LM Studio."
version = "0.9.2"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pypdf", "openai>=1.0"]
classifiers = [
    "Operating System :: OS Independent",
]

# classifiers = [
