[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax_h3_novel_pipeline"
version = "0.10.5"
description = "ComfyUI nodes for extracting novel references and generating MiniMax H3 prompts with LM Studio."
authors = [
  {name = "minimax_h3_novel", email = "djaufre@gmail.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.10"
dependencies = ["pypdf", "openai>=1.0,<3", "httpx>=0.27,<1"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "build",  # distribution checks
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/yuyuki/minimax_h3_novel_pipeline"
BugTracker = "https://github.com/yuyuki/minimax_h3_novel_pipeline/issues"
Documentation = "https://github.com/yuyuki/minimax_h3_novel_pipeline/wiki"

[tool.comfy]
PublisherId = "yuyuki"
DisplayName = "MiniMax H3 Novel Pipeline"
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility
Icon = ""
Tags = []
Repository = "https://github.com/yuyuki/minimax_h3_novel_pipeline"

includes = []

[tool.setuptools]
packages = ["minimax_h3_novel_pipeline", "minimax_h3_novel_pipeline.web"]
package-dir = {"minimax_h3_novel_pipeline" = "src", "minimax_h3_novel_pipeline.web" = "web"}
include-package-data = false

[tool.setuptools.package-data]
"minimax_h3_novel_pipeline.web" = ["js/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py310"
extend-exclude = ["external source"]

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
